<script>
const TYPES=['予定','メモ','Todo','お金'];const KEY='pocketPlannerEntries_v1',BKEY='pocketPlannerBudgets_v1',DB_NAME='PocketPlannerDB',DB_STORE='plannerState';let entries=[],budgets={},categories={'予定':[],'メモ':[],'Todo':[],'お金':[]},monthCovers={},yearCovers={},folders=[],trackers=[];let currentFolderId=null;let indexYear=new Date().getFullYear(),coverYear=new Date().getFullYear();let active='予定',homeMonth=new Date(),catMonth=new Date(),selectedDate=dateKey(new Date()),editingId=null;
let dbPromise=new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB非対応'));return}let req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{let db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
async function readPersisted(){let idbLoaded=false;try{let db=await dbPromise;let tx=db.transaction(DB_STORE,'readonly'),req=tx.objectStore(DB_STORE).get('state');let state=await new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)});if(state&&Array.isArray(state.entries)){entries=state.entries;budgets=state.budgets||{};categories=state.categories||categories;monthCovers=state.monthCovers||{};yearCovers=state.yearCovers||{};folders=state.folders||[];trackers=Array.isArray(state.trackers)?state.trackers:[];idbLoaded=true}}catch(e){console.warn('IndexedDB read:',e)}if(!idbLoaded){try{entries=JSON.parse(localStorage.getItem(KEY)||'[]');budgets=JSON.parse(localStorage.getItem(BKEY)||'{}');categories=JSON.parse(localStorage.getItem('pocketPlannerCategories_v1')||JSON.stringify(categories));monthCovers=JSON.parse(localStorage.getItem('pocketPlannerMonthCovers_v1')||'{}');yearCovers=JSON.parse(localStorage.getItem('pocketPlannerYearCovers_v1')||'{}');folders=JSON.parse(localStorage.getItem('pocketPlannerFolders_v1')||'[]');trackers=JSON.parse(localStorage.getItem('pocketPlannerTrackers_v1')||'[]')}catch(e){entries=[];budgets={}}try{await persistState()}catch(migrateErr){console.warn('IndexedDB移行保存に失敗:',migrateErr)}}try{localStorage.setItem(KEY,JSON.stringify(entries));localStorage.setItem(BKEY,JSON.stringify(budgets))}catch(e){console.warn('バックアップ保存容量不足:',e)}}
async function persistState(){let db=await dbPromise;return new Promise((resolve,reject)=>{let tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put({entries,budgets,categories,monthCovers:monthCovers,yearCovers,folders,trackers},'state');tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error||new Error('保存に失敗'));tx.onabort=()=>reject(tx.error||new Error('保存が中断'))})}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function setClock(){let n=new Date();document.getElementById('todayDate').textContent=`${n.getMonth()+1}月${n.getDate()}日`;document.getElementById('todayWeek').textContent=n.toLocaleDateString('ja-JP',{weekday:'long',year:'numeric',month:'long'});document.getElementById('clock').textContent=n.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});}

function calendarHTML(month,container,kind){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),html='';['日','月','火','水','木','金','土'].forEach(x=>html+=`<div class="weekday">${x}</div>`);for(let i=0;i<42;i++){let d=i-start+1,actual=d<1?new Date(y,m-1,prev+d):d>days?new Date(y,m+1,d-days):new Date(y,m,d);let key=dateKey(actual),isOther=d<1||d>days,has=kind==='home'?entries.some(e=>occursOn(e,key)):entries.some(e=>e.type===active&&occursOn(e,key)),sel=(kind==='category'||kind==='home')&&key===selectedDate,today=key===dateKey(new Date());html+=`<div class="day ${isOther?'other':''} ${sel?'selected':''} ${today?'today':''}" onclick="selectDate('${key}','${kind}')"><span class="num">${actual.getDate()}</span>${has?'<span class="star">★</span>':''}</div>`;}container.innerHTML=html;}
function repeatLabel(r){return ({daily:'毎日',weekly:'毎週',monthly:'毎月',yearly:'毎年',none:'なし'})[r]||'なし'}

function anniversaryStats(dateStr){let base=new Date(dateStr+'T00:00:00'),today=new Date();today.setHours(0,0,0,0);let days=Math.max(0,Math.floor((today-base)/86400000));let years=today.getFullYear()-base.getFullYear();let ann=new Date(base.getFullYear()+years,base.getMonth(),base.getDate());if(ann>today)years--;let next=years+1,nd=new Date(base.getFullYear()+next,base.getMonth(),base.getDate());let rem=Math.ceil((nd-today)/86400000);return {days,current:Math.max(0,years),next,nextDate:dateKey(nd),remaining:Math.max(0,rem)}}

function openTrackerEditor(tracker,isNew){let t={...tracker};let selectedColor=t.color||TRACKER_COLORS[0],selectedIcon=t.icon||'star',image=t.iconImage||'',mode=t.mode||'check',options=Array.isArray(t.options)&&t.options.length?t.options:trackerDefaultOptions();let backdrop=document.createElement('div');backdrop.className='tracker-modal-backdrop';backdrop.id='trackerEditor';backdrop.innerHTML=`<div class="tracker-modal"><h3>${isNew?'トラッカーを作成':'トラッカーを編集'}</h3><label>名前</label><input id="trackerEditName" type="text" maxlength="40" value="${escAttr(t.name||'')}"><label>記録方法</label><select id="trackerEditMode" onchange="toggleTrackerModeFields()" style="width:100%;background:#101015;color:#fff;border:1px solid #45434a;border-radius:9px;padding:11px"><option value="check" ${mode==='check'?'selected':''}>チェック式（達成／未達）</option><option value="color" ${mode==='color'?'selected':''}>色分け式（状態を選ぶ）</option></select><div id="trackerColorOptions" style="display:${mode==='color'?'block':'none'}"><label>色と項目名（自由に設定）</label><div class="tracker-mode-options" id="trackerColorOptionRows">${trackerOptionRows(options)}</div><button type="button" onclick="addTrackerColorOption()" style="margin-top:8px">＋ 色の項目を追加</button><div class="repeat-help">日付をタップして、ここで設定した状態を選択します。項目名と色はいつでも編集できます。</div></div><label>トラッカーの基本カラー</label><div class="tracker-swatches">${TRACKER_COLORS.map(c=>`<button type="button" class="tracker-swatch ${c===selectedColor?'selected':''}" data-color="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div><label>アイコンを選ぶ</label><div class="tracker-icons">${Object.keys(TRACKER_ICON_SVGS).map(k=>`<button type="button" class="tracker-icon-choice ${k===selectedIcon&&!image?'selected':''}" data-icon="${k}" aria-label="${k}"><svg viewBox="0 0 24 24">${TRACKER_ICON_SVGS[k]}</svg></button>`).join('')}</div><label>自分の画像を使う（任意）</label><div><img id="trackerImagePreview" class="tracker-image-preview" src="${image}" style="${image?'':'display:none'}"><input id="trackerImageFile" type="file" accept="image/*"></div><div class="tracker-modal-actions"><button type="button" onclick="closeTrackerEditor()">キャンセル</button><button type="button" class="tracker-add" onclick="saveTrackerEditor('${escAttr(t.id)}',${isNew})">保存</button></div></div>`;
 document.body.appendChild(backdrop);backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeTrackerEditor()});
 backdrop.querySelectorAll('[data-color]').forEach(btn=>btn.addEventListener('click',()=>{selectedColor=btn.dataset.color;backdrop.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('selected',x===btn))}));
 backdrop.querySelectorAll('[data-icon]').forEach(btn=>btn.addEventListener('click',()=>{selectedIcon=btn.dataset.icon;image='';backdrop.querySelectorAll('[data-icon]').forEach(x=>x.classList.toggle('selected',x===btn));document.getElementById('trackerImagePreview').style.display='none'}));

function closeTrackerEditor(){document.getElementById('trackerEditor')?.remove()}
async function saveTrackerEditor(id,isNew){let modal=document.getElementById('trackerEditor');if(!modal)return;let name=document.getElementById('trackerEditName').value.trim();if(!name){alert('名前を入力してください。');return;}let {selectedColor,selectedIcon,image,mode,options}=modal._get();if(mode==='color'&&options.length<2){alert('色分け式は項目を2つ以上設定してください。');return;}let target=trackers.find(x=>x.id===id);if(isNew){target={id,name,records:{}};trackers.push(target)}if(!target)return;target.name=name;target.color=selectedColor;target.icon=selectedIcon;target.iconImage=image||'';target.mode=mode;target.options=options;closeTrackerEditor();await save()}
async function deleteTracker(id){let t=trackers.find(x=>x.id===id);if(!t)return;if(!confirm(`「${t.name}」を削除しますか？\nこのトラッカーに保存された過去の月の記録も削除されます。`))return;trackers=trackers.filter(x=>x.id!==id);await save()}
async function toggleTrackerDay(id,day){
 let t=trackers.find(x=>x.id===id);if(!t)return;
 let key=`${trackerMonthKey()}-${String(day).padStart(2,'0')}`;
 if(!t.records)t.records={};
 if(t.mode==='color'){
  const options=t.options||trackerDefaultOptions();
  const current=t.records[key];
  const backdrop=document.createElement('div');
  backdrop.className='tracker-modal-backdrop';
  backdrop.id='trackerDayPicker';
  backdrop.innerHTML=`<div class="tracker-modal">
   <h3>${day}日の状態を選択</h3>
   <label for="trackerDayChoice">設定した色分け項目</label>
   <select id="trackerDayChoice" style="width:100%;background:#101015;color:#fff;border:1px solid #45434a;border-radius:9px;padding:9px;font-size:12px">
    <option value="">未記録にする</option>
    ${options.map((o,i)=>`<option value="${i}" ${current&&current.label===o.label?'selected':''}>${esc(o.label)}</option>`).join('')}
   </select>
   <div id="trackerDayChoicePreview" style="display:flex;align-items:center;gap:8px;margin-top:12px;color:#ccc;font-size:10px"></div>
   <div class="tracker-modal-actions">
    <button type="button" onclick="document.getElementById('trackerDayPicker')?.remove()">キャンセル</button>
    <button type="button" class="tracker-add" id="trackerDayChoiceSave">保存</button>
   </div>
  </div>`;
  document.body.appendChild(backdrop);
  const select=backdrop.querySelector('#trackerDayChoice');
  const preview=backdrop.querySelector('#trackerDayChoicePreview');
  const updatePreview=()=>{const o=options[Number(select.value)];preview.innerHTML=o?`<i style="width:16px;height:16px;border-radius:50%;background:${o.color};display:inline-block"></i>${esc(o.label)}`:'未記録';};
  select.addEventListener('change',updatePreview);updatePreview();
  backdrop.addEventListener('click',e=>{if(e.target===backdrop)backdrop.remove()});
  backdrop.querySelector('#trackerDayChoiceSave').addEventListener('click',async()=>{
   if(select.value==='')delete t.records[key];
   else{const o=options[Number(select.value)];if(!o)return;t.records[key]={label:o.label,color:o.color};}
   backdrop.remove();await save();
  });
  return;
 }
 if(t.records[key])delete t.records[key];else t.records[key]=true;
 await save();
}
function renderTrackers(){let wrap=document.getElementById('trackerList');if(!wrap)return;let month=trackerMonthKey(),days=trackerMonthDays();if(!trackers.length){wrap.innerHTML='<div class="tracker-empty">まだトラッカーがありません。「＋ 追加」から作成できます。</div>';return;}wrap.innerHTML=trackers.map(t=>{let records=t.records||{},done=0;for(let d=1;d<=days;d++)if(records[`${month}-${String(d).padStart(2,'0')}`])done++;let rate=Math.round(done/days*100),color=/^#[0-9a-fA-F]{6}$/.test(t.color||'')?t.color:'#D6B56D';let first=new Date(homeMonth.getFullYear(),homeMonth.getMonth(),1).getDay(),cells='';for(let i=0;i<first;i++)cells+='<div class="tracker-date empty"></div>';for(let d=1;d<=days;d++){let key=`${month}-${String(d).padStart(2,'0')}`,record=records[key],checked=!!record,recordColor=t.mode==='color'&&record&&typeof record==='object'?record.color:color,mark=t.mode==='color'&&record&&typeof record==='object'?esc(record.label):checked?'✓':'';cells+=`<button type="button" class="tracker-date ${checked?'done':''} ${t.mode==='color'&&checked?'tracker-color-day':''}" style="${checked?'background:'+recordColor+';':''}" aria-label="${d}日 ${checked?(t.mode==='color'?escAttr(record.label):'達成済み'):'未記録'}" title="${d}日${checked&&t.mode==='color'?' · '+escAttr(record.label):''}" onclick="toggleTrackerDay('${escAttr(t.id)}',${d})"><span class="day-num">${d}</span><span class="day-mark">${mark}</span></button>`;}let legend=t.mode==='color'?(t.options||trackerDefaultOptions()).map(o=>`<span style="display:inline-flex;align-items:center;gap:4px;margin:3px 6px 3px 0"><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${o.color}"></i>${esc(o.label)}</span>`).join(''):'日付をタップすると達成／未達成を切り替えられます。';return `<div class="tracker-card"><div class="tracker-top"><div class="tracker-icon" style="border:1px solid ${color};color:${color}">${trackerIconMarkup(t)}</div><div class="tracker-name">${esc(t.name)}${t.mode==='color'?' <span style="font-size:10px;color:#aaa">色分け</span>':''}</div><div class="tracker-actions"><button onclick="editTracker('${escAttr(t.id)}')">編集</button><button onclick="deleteTracker('${escAttr(t.id)}')">削除</button></div></div><div class="tracker-stats"><span><strong>${done}日</strong> 記録 / ${days}日</span><span>記録率 <strong>${rate}%</strong></span></div><div class="tracker-progress"><span style="width:${rate}%;background:${color}"></span></div><div class="tracker-calendar">${['日','月','火','水','木','金','土'].map(x=>`<div class="tracker-weekday">${x}</div>`).join('')}${cells}</div><div class="tracker-legend">${legend}</div></div>`}).join('')}

function addCategoryFromForm(){let name=prompt('追加するカテゴリー名');if(!name)return;name=name.trim();if(!name)return;if(!categories[active])categories[active]=[];if(!categories[active].includes(name)){categories[active].push(name);categories[active].sort((a,b)=>a.localeCompare(b,'ja'));}let select=document.getElementById('fCategory');if(select){select.innerHTML='<option value="">カテゴリーなし</option>'+categories[active].map(c=>`<option value="${escAttr(c)}">${esc(c)}</option>`).join('');select.value=name;updateEntryFolderOptions();}saveCategoryState()}async function saveCategoryState(){try{await persistState()}catch(e){}try{localStorage.setItem('pocketPlannerCategories_v1',JSON.stringify(categories))}catch(e){}}

  const obj={id:old?.id||crypto.randomUUID(),createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),type:active,category:document.getElementById('fCategory')?.value||'',folderId:document.getElementById('fFolder')?.value||'',background:document.getElementById('formContent').dataset.background||'',textColor:document.getElementById('fTextColor')?.value||old?.textColor||'light',overlay:document.getElementById('fOverlay')?.value||old?.overlay||'0.28',stamp,date,time:document.getElementById('fTime')?.value||old?.time||'',title,thumb,images,body:document.getElementById('fBody')?.value||'',repeat:repeatValue,repeatEnd:repeatEndValue,anniversary:anniversaryValue,reminder:active!=='お金'?(document.getElementById('fReminder')?.checked!==false&&!!document.getElementById('fTime')?.value):false,notified:old?.notified||[],relatedIds:Array.isArray(old?.relatedIds)?old.relatedIds:[]};

  if(old){const ix=entries.findIndex(e=>e.id===old.id);if(ix>=0)entries[ix]=obj;else entries.push(obj);}else entries.push(obj);

 try{

function relatedEntriesFor(e){return entries.filter(x=>String(x.id)!==String(e.id)&&((e.relatedIds||[]).some(id=>String(id)===String(x.id))||(x.relatedIds||[]).some(id=>String(id)===String(e.id))));}
function renderRelatedSection(e){const rel=relatedEntriesFor(e),id=escAttr(String(e.id));return `<div class="related-section"><div class="related-head">🔗 関連する登録内容</div>${rel.length?rel.map(x=>`<button class="related-item" onclick="showDetail('${escAttr(String(x.id))}')"><span class="ri-main"><strong>${esc(x.title||x.type||'登録内容')}</strong><small>${esc(x.type||'')} · ${esc(x.date||'日付なし')}</small></span><span>›</span></button>`).join(''):'<div class="muted">まだ関連登録はありません</div>'}<div class="related-actions"><button onclick="toggleRelatedPicker('${id}','add')">＋関連を追加</button>${rel.length?`<button onclick="toggleRelatedPicker('${id}','remove')">関連を解除</button>`:''}</div><div class="related-picker" id="relatedPicker" style="display:none"><div class="field"><label id="relatedPickerLabel">関連先を選択</label><select id="relatedPickerSelect"></select></div><div class="related-picker-actions"><button onclick="confirmRelatedSelection('${id}')">決定</button><button onclick="cancelRelatedPicker()\">キャンセル</button></div></div></div>`;}

async function readZipBackup(file){let bytes=new Uint8Array(await file.arrayBuffer()),dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),dec=new TextDecoder();for(let i=0;i+30<=bytes.length;i++){if(dv.getUint32(i,true)!==0x04034b50)continue;let flags=dv.getUint16(i+6,true),method=dv.getUint16(i+8,true),crc=dv.getUint32(i+14,true),size=dv.getUint32(i+18,true),nlen=dv.getUint16(i+26,true),elen=dv.getUint16(i+28,true),headerEnd=i+30+nlen+elen,start=headerEnd,end=start+size;if(headerEnd>bytes.length||end>bytes.length)continue;if(flags&8)continue;if(method!==0)continue;let name=dec.decode(bytes.slice(i+30,i+30+nlen));if(name.toLowerCase().endsWith('.json')){let content=bytes.slice(start,end);if(zipCrc32(content)!==crc)throw new Error('ZIP内のJSONが破損しています（CRCチェック不一致）');return JSON.parse(dec.decode(content))}}throw new Error('対応するJSONバックアップがありません。My Plannerで作成したZIP、またはJSONファイルを選択してください。')}
async function importBackup(file){if(!file)return;try{let data=file.name.toLowerCase().endsWith('.zip')?await readZipBackup(file):JSON.parse(await file.text());if(!data||!Array.isArray(data.entries))throw new Error('登録内容（entries）が見つかりません');if(data.budgets!==undefined&&(!data.budgets||typeof data.budgets!=='object'||Array.isArray(data.budgets)))throw new Error('予算データの形式が違います');const exportedAt=data.exportedAt||'',fallbackTime=exportedAt||'1970-01-01T00:00:00.000Z';const cleanEntries=data.entries.filter(e=>e&&typeof e==='object'&&!Array.isArray(e)).map(e=>({...e,id:e.id||crypto.randomUUID(),category:e.category||'',folderId:e.folderId||'',createdAt:e.createdAt||fallbackTime,updatedAt:e.updatedAt||e.createdAt||fallbackTime}));let added=0,updated=0,unchanged=0,merged=entries.slice();for(const incoming of cleanEntries){let ix=merged.findIndex(e=>String(e.id)===String(incoming.id));if(ix<0){merged.push(incoming);added++;continue;}let cur=merged[ix];if(JSON.stringify(cur)===JSON.stringify(incoming)){unchanged++;continue;}let curTime=Date.parse(cur.updatedAt||cur.createdAt||0)||0,newTime=Date.parse(incoming.updatedAt||incoming.createdAt||0)||0;if(newTime>=curTime){merged[ix]=incoming;updated++;}else unchanged++;}
const incomingBudgets=data.budgets&&typeof data.budgets==='object'&&!Array.isArray(data.budgets)?data.budgets:{};let newBudgets={...budgets,...incomingBudgets},newCategories={...categories};for(const t of TYPES){let current=Array.isArray(categories[t])?categories[t]:[],incoming=Array.isArray(data.categories?.[t])?data.categories[t]:[];newCategories[t]=Array.from(new Set([...current,...incoming.filter(x=>typeof x==='string'&&x.trim())]));}let newMonthCovers={...monthCovers,...(data.monthCovers&&typeof data.monthCovers==='object'?data.monthCovers:{})},newYearCovers={...yearCovers,...(data.yearCovers&&typeof data.yearCovers==='object'?data.yearCovers:{})};
let newTrackers=trackers.map(t=>({...t,records:{...(t.records||{})}})),trackerAdded=0,trackerUpdated=0;for(const incoming of (Array.isArray(data.trackers)?data.trackers:[])){if(!incoming||!incoming.id)continue;let ix=newTrackers.findIndex(t=>String(t.id)===String(incoming.id));if(ix<0){newTrackers.push({...incoming,records:{...(incoming.records||{})}});trackerAdded++;}else{let cur=newTrackers[ix],mergedRecords={...(cur.records||{}),...(incoming.records||{})};if(JSON.stringify(cur)!==JSON.stringify({...cur,...incoming,records:mergedRecords})){newTrackers[ix]={...cur,...incoming,records:mergedRecords};trackerUpdated++;}}}

let promptText=`バックアップを差分復元します。\n\n登録内容\n更新・上書き：${updated}件\n新規追加：${added}件\n変更なし：${unchanged}件\n\nフォルダー：追加 ${folderAdded}件／更新 ${folderUpdated}件\nトラッカー：追加 ${trackerAdded}件／更新 ${trackerUpdated}件\n\nバックアップにない既存データは削除しません。続けますか？`;if(!confirm(promptText))return;let snapshot={entries,budgets,categories,monthCovers,yearCovers,folders,trackers};entries=merged;budgets=newBudgets;categories=newCategories;monthCovers=newMonthCovers;yearCovers=newYearCovers;folders=newFolders;trackers=newTrackers;let saved=await save();if(!saved){({entries,budgets,categories,monthCovers,yearCovers,folders,trackers}=snapshot);try{renderAll()}catch{};alert('復元内容を保存できませんでした。元のデータは変更していません。');return;}alert(`復元しました。\n更新・上書き：${updated}件\n新規追加：${added}件\n変更なし：${unchanged}件\nフォルダー追加：${folderAdded}件／更新：${folderUpdated}件\nトラッカー追加：${trackerAdded}件／更新：${trackerUpdated}件\n画像・表紙データも反映しました。`)}catch(err){console.error('バックアップ復元:',err);alert('バックアップを読み込めませんでした。ZIPまたはJSONファイルを確認してください。\n'+(err&&err.message?err.message:''))}}

function openFolderForm(id){let old=folders.find(x=>String(x.id)===String(id));let types=['予定','メモ','Todo','お金'];let html=`<div class="field"><label>フォルダー名</label><input id="folderName" value="${escAttr(old?.name||'')}" placeholder="例：仕事、プライベート"></div><div class="field"><label>対象タイプ</label><select id="folderType">${types.map(t=>`<option value="${t}" ${old?.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>カテゴリー</label><div style="display:flex;gap:7px"><select id="folderCategory" style="flex:1;width:auto">${(categories[old?.type||'予定']||[]).map(c=>`<option value="${escAttr(c)}" ${old?.category===c?'selected':''}>${esc(c)}</option>`).join('')||'<option value="">カテゴリーなし</option>'}</select><button type="button" onclick="addCategoryFromFolderForm()">＋追加</button></div></div><div class="field"><label>表紙サムネイル</label><input type="file" id="folderCoverFile" accept="image/*"><div class="preview" id="folderCoverPreview">${old?.cover?`<img src="${old.cover}">`:''}</div></div><div class="form-actions"><button onclick="saveFolder('${escAttr(old?.id||'')}')">保存</button>${old?`<button onclick="deleteFolder('${escAttr(old.id)}')">削除</button>`:''}<button onclick="closeModal()">キャンセル</button></div>`;document.getElementById('formTitle').textContent=old?'フォルダー編集':'フォルダー追加';document.getElementById('formContent').innerHTML=html;document.getElementById('formContent').dataset.cover=old?.cover||'';document.getElementById('folderType').onchange=()=>{let t=document.getElementById('folderType').value,sel=document.getElementById('folderCategory');sel.innerHTML=(categories[t]||[]).map(c=>`<option value="${escAttr(c)}">${esc(c)}</option>`).join('')||'<option value="">カテゴリー未登録</option>';sel.value=(categories[t]||[])[0]||''};document.getElementById('folderCoverFile').onchange=async e=>{if(e.target.files[0]){let data=await fileData(e.target.files[0]);document.getElementById('formContent').dataset.cover=data;document.getElementById('folderCoverPreview').innerHTML async function addCategoryFromFolderForm(){let type=document.getElementById('folderType')?.value||'予定',name=prompt('追加するカテゴリー名');if(!name)return;name=name.trim();if(!name)return;if(!categories[type])categories[type]=[];if(!categories[type].includes(name)){categories[type].push(name);categories[type].sort((a,b)=>a.localeCompare(b,'ja'));}let sel=document.getElementById('folderCategory');if(sel){sel.innerHTML=(categories[type]||[]).map(c=>`<option value="${escAttr(c)}">${esc(c)}</option>`).join('')||'<option value="">カテゴリーなし</option>';sel.value=name;}await saveCategoryState()}async function saveFolder(id){let name=document.getElementById('folderName').value.trim(),type=document.getElementById('folderType').value,category=document.getElementById('folderCategory').value;if(!name||!category){alert('フォルダー名とカテゴリーを設定してください');return;}let old=folders.find(f=>String(f.id)===String(id)),obj={id:old?.id||crypto.randomUUID(),name,type,category,cover:document.getElementById('formContent').dataset.cover||old?.cover||''};if(old){folders[folders.findIndex(f=>String(f.id)===String(old.id))]=obj;if(old.type!==type||old.category!==category){entries=entries.map(e=>String(e.folderId)===String(old.id)?({...e,type,category,updatedAt:new Date().toISOString()}):e)}}else folders.push(obj);if(await save()){closeModal();renderFolders()}}

function checkReminders(){let now=new Date(),key=dateKey(now),hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');let due=entries.filter(e=>e.reminder&&e.time&&occursOn(e,key)&&e.time<=hm&&!(e.notified||[]).includes(key));if(!due.length)return;let delivered=[];due.forEach(e=>{let title='リマインド：'+(e.title||e.type),body=e.body||e.type+'の登録時間です';let sent=false;if('Notification' in window&&Notification.permission==='granted'){try{new Notification(title,{body,tag:e.id+'-'+key});sent=true}catch(err){console.warn('通知表示エラー',err);}}else{alert(title+'\n'+body);sent=true;}if(sent){e.notified=e.notified||[];e.notified.push(key);delivered.push(e)}});if(delivered.length)save();}

async function enableReminderNotifications(){
  if(!('Notification' in window)){alert('この環境では通知APIが利用できません。Safariで開くか、ホーム画面に追加したアプリで試してください。');return;}
  const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
  const isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  if(isIOS&&!isStandalone){alert('iPhoneではホーム画面に追加したアプリから通知を許可してください。\nSafariの共有ボタン →「ホーム画面に追加」→ 追加したアプリを開いて通知設定を押します。');return;}
  try{
    let permission=Notification.permission;
    if(permission==='default') permission=await Notification.requestPermission();
    if(permission==='granted'){
      try{new Notification('通知テスト',{body:'My Plannerの通知が有効になりました。アプリを開いている間、リマインドを確認します。',tag:'planner-notification-test'});}catch(e){alert('通知許可はされていますが、テスト通知を表示できませんでした。iPhoneの設定で通知を確認してください。');return;}
      alert('通知を許可しました。\n予定のリマインド時間を設定してください。\n※このHTML版はアプリを開いている間の通知確認が中心です。閉じている間の通知は保証できません。');
    }else if(permission==='denied'){
      alert('通知が拒否されています。\niPhoneの設定 → 通知 → My Planner（またはSafari）から通知を許可してください。ブラウザから再許可できない場合があります。');
    }else alert('通知の許可が完了しませんでした。もう一度通知設定を押してください。');
  }catch(err){console.error('通知許可エラー',err);alert('通知設定中にエラーが発生しました。iPhoneの通知設定とブラウザを確認してください。');}
}
